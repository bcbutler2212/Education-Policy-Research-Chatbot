<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education Policy Research Chatbot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="title">Education Policy Research Bot</h1>
                <p class="subtitle">Ask questions about education policy, funding, and research</p>
            </div>
        </header>

        <main class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message bot-message">
                    <div class="message-content">
                        <p>Hello! I'm your education policy research assistant. Ask me anything about education policy, school funding, educational research, or related topics.</p>
                        <div class="suggestions">
                            <button class="suggestion-btn" onclick="sendSuggestion('What is education policy?')">What is education policy?</button>
                            <button class="suggestion-btn" onclick="sendSuggestion('What are school vouchers?')">What are school vouchers?</button>
                            <button class="suggestion-btn" onclick="sendSuggestion('How does federal education funding work?')">How does federal education funding work?</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-container">
                <div class="input-wrapper">
                    <textarea
                        id="messageInput"
                        placeholder="Type your education policy question here..."
                        rows="1"
                        maxlength="500"
                    ></textarea>
                    <button id="sendButton" class="send-button" onclick="sendMessage()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" fill="currentColor"/>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>Searching education policy database...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
