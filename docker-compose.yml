services:
  app:
    build: .
    # volumes:
    #   - .:/app
    ports:
      - "7860:7860"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_HOST=https://ollama-server.politeglacier-cb73354c.eastus.azurecontainerapps.io
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PYTHONUNBUFFERED=1
      - COSMOS_ENDPOINT=${COSMOS_ENDPOINT}
      - COSMOS_KEY=${COSMOS_KEY}
      - COSMOS_DATABASE=${COSMOS_DATABASE}
      - COSMOS_CONTAINER=${COSMOS_CONTAINER}

  frontend:
    build: 
      context: ./frontend
      args:
        VITE_API_URL: https://edu-backend.politeglacier-cb73354c.eastus.azurecontainerapps.io
    ports:
      - "5173:5173"


